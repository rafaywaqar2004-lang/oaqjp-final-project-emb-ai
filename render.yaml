services:
  - type: web
    name: gulf-ai-tech-bloc-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python patch_og_tags.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SITE_URL
        value: https://oaqjp-final-project-emb-ai-c8u6.onrender.com
